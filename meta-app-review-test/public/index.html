<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>WhatsApp Business Management Test</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="container">
      <h1>WhatsApp Business Management Test</h1>

      <section class="card connection-card">
        <h2>WhatsApp Connection</h2>
        <p class="hint">Enter a connection to test. Credentials are used for this request only.</p>
        <form id="connection-form">
          <label for="access-token">Access Token</label>
          <input id="access-token" name="accessToken" type="password" autocomplete="off" required />

          <label for="business-account-id">WhatsApp Business Account ID</label>
          <input id="business-account-id" name="businessAccountId" type="text" inputmode="numeric" required />

          <label for="graph-api-version">Graph API Version</label>
          <input id="graph-api-version" name="graphApiVersion" type="text" value="v25.0" pattern="v[0-9]+\\.[0-9]+" required />

          <button type="submit">Load WhatsApp Information</button>
        </form>
      </section>

      <section id="waba" class="card">
        <h2>WhatsApp Business Account</h2>
        <div><strong>Business Account ID:</strong> <span id="waba-id">—</span></div>
        <div><strong>Verified / Display Name:</strong> <span id="waba-name">—</span></div>
        <div><strong>Quality Rating:</strong> <span id="waba-quality">—</span></div>
      </section>

      <section id="phones" class="card">
        <h2>Connected Phone Numbers</h2>
        <div id="phone-list">No data</div>
      </section>

      <div class="controls">
        <button id="refresh" type="button">Refresh WhatsApp Information</button>
        <div id="status" class="status">Ready</div>
      </div>
    </main>

    <script>
      async function fetchInfo() {
        const form = document.getElementById('connection-form');
        const formData = new FormData(form);
        setStatus('Loading...');
        try {
          const res = await fetch('/api/whatsapp-info', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(Object.fromEntries(formData))
          });
          const data = await res.json();
          if (!res.ok) {
            const err = data?.error || {};
            showError(res.status, err.message || 'Unknown error', err.suggestion || '');
            return;
          }

          document.getElementById('waba-id').textContent = data.whatsapp_business_account.id || '—';
          document.getElementById('waba-name').textContent = data.whatsapp_business_account.name || '—';
          document.getElementById('waba-quality').textContent = data.whatsapp_business_account.quality_rating || '—';

          const list = document.getElementById('phone-list');
          list.innerHTML = '';
          if (!data.phone_numbers || data.phone_numbers.length === 0) {
            list.textContent = 'No phone numbers found';
          } else {
            data.phone_numbers.forEach(p => {
              const d = document.createElement('div');
              d.className = 'phone-item';
              d.innerHTML = `
                <div><strong>Phone Number:</strong> ${escapeHtml(p.display_phone_number || '—')}</div>
                <div><strong>Phone Number ID:</strong> ${escapeHtml(p.id || '—')}</div>
                <div><strong>Verified Name:</strong> ${escapeHtml(p.verified_name || '—')}</div>
                <div><strong>Status:</strong> ${escapeHtml(p.status || '—')}</div>
              `;
              list.appendChild(d);
            });
          }

          setStatus('Loaded');
        } catch (err) {
          showError(500, 'Network or server error while fetching WhatsApp info', 'Ensure the server is running and can reach the Meta Graph API.');
        }
      }

      function setStatus(text) { document.getElementById('status').textContent = text; }

      function showError(status, message, suggestion) {
        const list = document.getElementById('phone-list');
        list.innerHTML = `<div class="error"><strong>Error:</strong> HTTP ${status} — ${escapeHtml(message)}<div class="suggest">${escapeHtml(suggestion || '')}</div></div>`;
        setStatus('Error');
      }

      function escapeHtml(s){ return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'); }

      document.getElementById('connection-form').addEventListener('submit', event => {
        event.preventDefault();
        fetchInfo();
      });
      document.getElementById('refresh').addEventListener('click', fetchInfo);
    </script>
  </body>
</html>
